name: Build launcher

on:
  schedule:
    - cron: "17 6 * * *"   # nightly
  workflow_dispatch:         # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths:
      - launcher.config.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect Pages sites
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}   # optional, only needed to include private repos
        run: node scripts/build-projects.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code -- projects.json 2>/dev/null && git ls-files --error-unmatch projects.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Refresh launcher project list"
          git push
