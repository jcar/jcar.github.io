name: Build launcher

on:
  schedule:
    - cron: "17 6 * * *"   # nightly
  workflow_dispatch:         # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths:
      - launcher.config.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Mints a short-lived token from the Launchpad GitHub App, so there's no token to renew.
      # Skipped until the LAUNCHER_APP_ID variable is set; then the personal token below is the fallback.
      - name: Get GitHub App token
        id: app
        if: ${{ vars.LAUNCHER_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LAUNCHER_APP_ID }}
          private-key: ${{ secrets.LAUNCHER_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Collect Pages sites
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed to include private repos: the App token if set up, else the personal token.
          LAUNCHER_TOKEN: ${{ steps.app.outputs.token || secrets.LAUNCHER_TOKEN }}
          LAUNCHER_TOKEN_KIND: ${{ steps.app.outputs.token && 'app' || 'pat' }}
        run: node scripts/build-projects.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code -- projects.json 2>/dev/null && git ls-files --error-unmatch projects.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Refresh launcher project list"
          git push
